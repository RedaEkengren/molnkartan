name: Mätning och sida

# Mäter hela landet den 1:a varje månad, committar rådatan och publicerar sidan.
# Git-historiken är loggen: varje mätning är en commit med tidsstämpel.
on:
  schedule:
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      prov:
        description: "Provkörning: bara webbmätning av Stockholms län, inget committas"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["docs/**", "data/**", "klassa*.py", "webb_klassa.py", "leverantorer.csv", "bygg_sida.py", "triangulering.py", "sakerhet.py", "fynd_siffror.py", "tests/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: matning
  cancel-in-progress: false

jobs:
  mat:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install dnspython==2.7.0
      - name: Provkörning
        if: inputs.prov
        run: |
          fil=$(python3 webbmatning.py organisationer.csv)
          python3 webb_klassa.py "${fil#$PWD/}" | tail -6
          python3 -c "import json,sys; [print('FEL', o['namn'], str(o['status'])[:120]) for o in json.load(open(sys.argv[1]))['organisationer'] if not isinstance(o['status'], int) or o['status'] >= 400]" "$fil"
      - name: Mät
        if: ${{ !inputs.prov }}
        run: |
          python3 matning.py organisationer-sverige.csv
          python3 webbmatning.py organisationer-sverige.csv
          python3 matning.py organisationer-myndigheter-matning.csv
          python3 webbmatning.py organisationer-myndigheter-matning.csv
          python3 triangulering.py
          python3 sakerhet.py
          python3 bygg_sida.py
      - name: Committa
        if: ${{ !inputs.prov }}
        run: |
          git config user.name "molnkartan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json docs/myndigheter.json
          git commit -m "Mätning $(date -u +%Y-%m-%d)" || echo "inga ändringar"
          git push

  publicera:
    needs: mat
    if: always() && !inputs.prov && (needs.mat.result == 'success' || needs.mat.result == 'skipped')
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install dnspython==2.7.0
      - name: Sidan följer reglerna
        run: python3 -m unittest -v tests/test_sida.py tests/test_hygien.py tests/test_fynd.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
